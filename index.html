<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENJ.MOVIE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%2329B6F6%22>▮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== NAV ===== -->
<header id="siteHeader" class="header">
  <div class="header__inner">
    <div class="header__left">
      
      <button class="logo" id="logoBtn" aria-label="Go to home">
        <span class="logo-accent">BENJ</span><span class="logo-dot">·</span><span class="logo-text">MOVIE</span>
      </button>

      <nav class="nav" id="primaryNav">
        <button class="nav__link is-active" data-view="home">Home</button>
        <button class="nav__link" data-view="movies">Movies</button>
        <button class="nav__link" data-view="tv">TV Shows</button>
        <button class="nav__link" data-view="anime">Anime</button>
      </nav>
    </div>
    <div class="header__right">
      <div class="search" id="searchWrap">
        <button id="searchToggle" class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M18 10.5A7.5 7.5 0 1 1 10.5 3a7.5 7.5 0 0 1 7.5 7.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <input id="searchInput" type="text" placeholder="Titles, people, genres">
      </div>
    </div>
  </div>
</header>

<!-- ===== SEARCH RESULTS VIEW ===== -->
<section id="searchResultsView" class="search-view hidden">
  <div class="section__head">
    <h2>Results for “<span id="searchQueryLabel"></span>”</h2>
  </div>
  <div id="searchResultsGrid" class="grid-results"></div>
</section>

<!-- ===== HERO ===== -->
<section id="hero" class="hero">
  <div class="hero__bg" id="heroBg"></div>
  <div class="hero__scrim"></div>
  <div class="hero__content">
    <div class="hero__badge" id="heroBadge">Trending Now</div>
    <h1 class="hero__title" id="heroTitle">Loading…</h1>
    <p class="hero__meta" id="heroMeta"></p>
    <p class="hero__overview" id="heroOverview"></p>
    <div class="hero__actions">
      <button class="btn btn--play" id="heroPlayBtn">
        <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>
        Play
      </button>
      <button class="btn btn--ghost" id="heroInfoBtn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor"/></svg>
        More Info
      </button>
    </div>
  </div>
  <div class="hero__dots" id="heroDots"></div>
</section>

<!-- ===== MAIN ROWS ===== -->
<main id="mainContent">
  <div id="rowsHost"></div>
</main>

<footer class="footer">
  <div class="footer__inner">
    <div class="footer__mark">BENJ.MOVIE</div>
    <p><span>© 2026 All rights reserved</span> <span class="me"> <a href="#">HichemBenj</a> </span></p>
  </div>
</footer>

<!-- ===== DETAIL MODAL ===== -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal" id="modalPanel">
    <button class="modal__close" id="modalClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="modal__media">
      <img id="modalBackdrop" alt="">
      <div class="modal__media-scrim"></div>
      <div class="modal__media-actions">
        <button class="btn btn--play btn--sm" id="modalPlayBtn">
          <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>
          Play
        </button>
        <button class="icon-btn icon-btn--ring" id="modalLikeBtn" aria-label="Like">
          <svg viewBox="0 0 24 24"><path d="M7 22V11l5.5-8 1 1-1.5 6H19a2 2 0 0 1 1.94 2.5l-1.8 7A2 2 0 0 1 17.2 21H10a3 3 0 0 1-3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="modal__body">
      <div class="modal__main">
        <h2 id="modalTitle"></h2>
        <div class="modal__facts" id="modalFacts"></div>
        <p id="modalOverview"></p>
      </div>
      <div class="modal__side">
        <div><span class="modal__label">Genres</span><p id="modalGenres"></p></div>
        <div><span class="modal__label">Original language</span><p id="modalLang"></p></div>
        <div><span class="modal__label">Rating</span><p id="modalRating"></p></div>
      </div>
    </div>
    <div class="modal__more">
      <h3>More like this</h3>
      <div class="modal__more-grid" id="modalMoreGrid"></div>
    </div>
  </div>
</div>

<!-- ===== VIDCORE PLAYER MODAL ===== -->
<div id="playerModalOverlay" class="player-modal-overlay">
  <div class="player-modal" id="playerModalPanel">
    <button class="player-modal__close" id="playerModalClose" aria-label="Close Player">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    
    <div class="player-layout">
      <!-- Main Video Iframe Container -->
      <div class="player-container">
        <iframe 
  src="https://vidcore.io/movie/{id}" 
  width="100%" 
  height="100%" 
  frameborder="0" 
  allowfullscreen 
  allow="encrypted-media"
></iframe>

      </div>

      <!-- TV Episode Drawer (Hidden for Movies) -->
      <div class="player-drawer hidden" id="playerDrawer">
        <div class="player-drawer__head">
          <div class="player-drawer__title">Episodes</div>
          <select id="seasonSelect" class="drawer-season-select"></select>
        </div>
        <div class="player-drawer__list" id="episodesList">
          <!-- Visual Episode Cards Render Dynamically Here -->
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
